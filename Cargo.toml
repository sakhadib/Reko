[package]
name = "reko"
version = "0.1.0"
edition = "2021"
description = "Cross-platform polyglot code extractor: 15 languages → exact IR JSONL (reader → ExtractionFactory)"
license = "MIT OR Apache-2.0"
authors = ["sakhadib"]
repository = "https://github.com/sakhadib/Reko"
readme = "README.md"
keywords = ["cli", "parser", "polyglot", "ast", "code-analysis"]
categories = ["command-line-utilities", "development-tools::build-utils"]
homepage = "https://github.com/sakhadib/Reko"
documentation = "https://github.com/sakhadib/Reko"
exclude = ["ManualTest/*", "supportive/*", "target/*", "reko.jsonl"]

[[bin]]
name = "reko"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
clap-verbosity-flag = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
regex = "1.10"
ignore = "0.4"
rayon = "1.10"
indicatif = "0.17"
sqlite-vec = "0.1.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ort = { version = "2.0.0-rc.13", features = ["ndarray", "half"] }
tokenizers = "0.22"
ndarray = "0.16"
dirs = "5.0"
hf-hub = "0.4"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
